<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login | Portal do Funcionário </title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="bg-login">
        <style>
            .body {
                font-family: 'Inter', sans-serif;
                margin: 0;
                height: 100vh;
                overflow: hidden;
            }
            
            .bg-login {
                position: absolute;
                width: 100%;
                height: 100%;
                background-image: url('/static/login_background.jpg');
                background-size: cover;
                background-position: center;
                filter: brightness(0.55);
                z-index: 0;
            }

            .bg-overlay {
                position: absolute;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1;
            }

            .login-card {
                max-width: 300px;
                width: 100%;
                padding: 30px;
                border-radius: 16px;
                backdrop-filter: blur(14px);
                background: rgba(255, 255, 255, 0.13);
                border: 1px solid rgba(255, 255, 255, 0.25);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            }

            .login-card label {
                color: white;
                font-weight: 500;
            }

            .login-card h3 {
                color: rgb(39, 93, 175);
                font-weight: 600;
                margin-bottom: 20px;
            }

            .link-light-custom {
                color: #f8f9fa;
                text-decoration: none;
            }
            .link-light-custom:hover {
                text-decoration: underline;
            }
        </style>
    </div>
    <div class="bg-overlay"></div>

    <div class="d-flex justify-content-center align-items-center vh-100" style="position: relative; z-index: 10;">
        <div class="login-card">
            <h3 class="text-center mb-4">Portal do Funcionário</h3>

            <form method="POST" action="{{ url_for('auth.login') }}">

                <div class="mb-3">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="mb-3">
                    <label for="senha">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>

                <div class="text-center mt-3">
                    <a class="link-light-custom" href="{{ url_for('empresas.nova_empresa_public') }}">Primeiro acesso? Cadastre sua empresa aqui.</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        window.onload = () => document.body.classList.add("loaded");
    </script>
</body>
</html>
