{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Editar Administrador</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" name="nome" value="{{ admin.nome }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ admin.email }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="text" class="form-control" name="telefone" value="{{ admin.telefone }}" maxlength="15" required>
        </div>
        <div class="mb-3">
            <label for="data_nascimento" class="form-label">Data de Nascimento</label>
            <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" value="{{ admin.data_nascimento.strftime('%Y-%m-%d') if admin.data_nascimento else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="rua" class="form-label">Rua</label>
            <input type="text" class="form-control" id="rua" name="rua" value="{{ admin.rua }}" required>
        </div>
        <div class="mb-3">
            <label for="numero" class="form-label">Número</label>
            <input type="text" class="form-control" id="numero" name="numero" value="{{ admin.numero }}" required>
        </div>
        <div class="mb-3">
            <label for="bairro" class="form-label">Bairro</label>
            <input type="text" class="form-control" id="bairro" name="bairro" value="{{ admin.bairro }}" required>
        </div>
        <div class="mb-3">
            <label for="cidade" class="form-label">Cidade</label>
            <input type="text" class="form-control" id="cidade" name="cidade" value="{{ admin.cidade }}" required>
        </div>
        <div class="mb-3">
            <label for="uf" class="form-label">UF</label>
            <select name="uf" class="form-select" id="uf" required>
                <option value="">Selecione</option>
                {% for estado in ['AC', 'AL', 'AP', 'AM', 'BA', 'CE', 'DF', 'ES', 'GO', 'MA', 'MT', 'MS', 'MG', 'PA', 'PB', 'PR', 'PE', 'PI', 'RJ', 'RN', 'RS', 'RO', 'RR', 'SC', 'SP', 'SE', 'TO'] %}
                <option value="{{ estado }}" {% if admin.uf == estado %}selected{% endif %}>{{ estado }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" name="cpf" value="{{ admin.cpf }}" required maxlength="14" placeholder="000.000.000-00">
        </div>
         <div class="mb-3">
            <label for="salario_mensal" class="form-label">Salário Mensal (R$ - Bruto)</label>
            <input type="text" class="form-control" id="salario_mensal" name="salario_mensal" value="{{ admin.salario_mensal }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Empresa</label>
            <select class="form-select" name="empresa_id" required>
                {% for empresa in empresas %}
                <option value="{{ empresa.id }}" {% if admin.empresa_id == empresa.id %}selected{% endif %}>
                    {{ empresa.razao_social }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Cargo</label>
            <input type="text" class="form-control" name="cargo" value="{{ admin.cargo }}" placeholder="Ex: Gerente, Supervisor, etc." required>
        </div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{{ url_for('superadmin.listar_admins') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<script>
    document.getElementById("telefone")?.addEventListener("input", function() {
        let v = this.value.replace(/\D/g, "");
        v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
        v = v.replace(/(\d{5})(\d)/, "$1-$2");
        this.value = v.substring(0, 15);
    });
</script>
{% endblock %}
