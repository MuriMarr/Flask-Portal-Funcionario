{% extends 'base.html' %}
{% block content %}
<div class="container mt-3" style="max-width: 500px">
    <h6 class="mb-3">Editar Funcionário</h6>
    <hr>
    <form method="POST">
        <div class="mb-3">
            <label>Nome</label>
            <input type="text" name="nome" class="form-control" value="{{ nome }}" required>
        </div>  

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ email }}" placeholder="email@email.com" required>
        </div>
        <hr>
        <p class="mb-3">Dados Cadastrais</p>
        <div class="mb-3">
            <label for="data_nascimento" class="form-label">Data de Nascimento</label>
            <input type="date" class="form-control" id="data_nascimento" name="data_nascimento" value="{{ data_nascimento }}" required>
        </div>
    
        <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text" class="form-control" id="cpf" name="cpf" value="{{ cpf }}" required maxlength="14" placeholder="000.000.000-00">
        </div>

        <div class="mb-3">
            <label for="cargo" class="form-label">Cargo</label>
            <input type="text" class="form-control" id="cargo" name="cargo" value="{{ cargo }}" required>
        </div>

        <div class="mb-3">
            <label for="salario_mensal" class="form-label">Salário Mensal (R$ - Bruto)</label>
            <input type="text" class="form-control" id="salario_mensal" name="salario_mensal" value="{{ salario_mensal }}" required>
        </div>
        <hr>
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{{ url_for('admin.funcionarios') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
